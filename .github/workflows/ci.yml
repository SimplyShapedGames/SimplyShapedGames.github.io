name: Website checks and Cloudflare Pages package

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Source checks and downloadable public files only; no deployment rights.
      - uses: actions/upload-artifact@v4
        with:
          name: simplyshapedgames-cloudflare-pages-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
